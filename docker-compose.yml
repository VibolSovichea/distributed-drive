# Running the service in a container.
#
# There is deliberately no database service here. SQLite is embedded in the
# binary through a pure-Go driver, so the only thing to manage is a volume for
# the database file. A separate database container would add a network hop, a
# second thing to back up, and a different failure mode from a plain `make run`.
#
# This also means nothing has to be installed on the host to run the service:
# there is no sqlite3 binary, no package, and no C library, because the driver
# is compiled into the binary. `docker compose up` is the whole setup.

services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: distributed-drive:dev
    ports:
      - "${DD_HTTP_ADDR:-:8080}:8080"
    environment:
      DD_HTTP_ADDR: ":8080"
      DD_DATABASE_PATH: /data/distributed-drive.db
      DD_DATABASE_BUSY_TIMEOUT: 5s
      DD_DATABASE_MAX_OPEN_CONNS: "1"
      DD_MIGRATE_ON_START: "true"
      DD_LOG_LEVEL: ${DD_LOG_LEVEL:-info}
      DD_LOG_FORMAT: ${DD_LOG_FORMAT:-json}
    volumes:
      - api-data:/data
    # Migrations run at startup, so give the container time to finish them
    # before the first request is judged unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # The server drains in-flight requests on SIGTERM, so it needs longer than
    # the default 10 seconds before it is killed outright.
    stop_grace_period: 20s

volumes:
  api-data:

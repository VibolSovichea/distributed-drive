version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - nilerr
    - errorlint
    - gocritic
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
  exclusions:
    rules:
      - path: internal/crypto/crypto\.go
        linters:
          - unused
      - path: internal/fileapi/service\.go
        linters:
          - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
